[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teyitscope"
version = "0.1.0"
description = "Açık kaynak görsel adli analiz ve teyit araç seti"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "TeyitScope Contributors" }]
dependencies = ["Pillow>=10.0", "typer>=0.12"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
teyitscope = "teyitscope.cli:app"

[tool.setuptools.packages.find]
include = ["teyitscope*"]
