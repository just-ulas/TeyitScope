<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeyitScope — Kayıtsız Görsel Teyit</title><style>body{font-family:system-ui;background:#101522;color:#eef2ff;max-width:880px;margin:auto;padding:32px}main{background:#182238;padding:28px;border-radius:18px}button{background:#e85d3f;color:white;border:0;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer}input{margin:18px 0}.muted{color:#aebbd5}.bar{height:14px;background:#2d3952;border-radius:8px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#f0ad3d,#e34b35);width:0}</style></head><body><main><h1>TeyitScope</h1><p class="muted">Kayıt istemeyen, açık kaynak görsel adli analiz arayüzü.</p><input id="file" type="file" accept="image/*"><br><button id="go">Yerelde analiz et</button><p id="status" class="muted"></p><section id="result" hidden><h2>Rapor</h2><p id="meta"></p><div class="bar"><div class="fill" id="fill"></div></div><p id="score"></p><pre id="json"></pre></section></main><script>const $=id=>document.getElementById(id);$('go').onclick=async()=>{const f=$('file').files[0];if(!f)return $('status').textContent='Önce bir görsel seçin.';$('status').textContent='Analiz ediliyor…';const d=new FormData();d.append('upload',f);try{const r=await fetch('/v1/analyze',{method:'POST',body:d});if(!r.ok)throw Error('API kapalı');const j=await r.json();$('result').hidden=false;$('meta').textContent=`${j.width}×${j.height} — ${j.source}`;$('fill').style.width=j.manipulation_score+'%';$('score').textContent=`Manipülasyon şüphesi: %${j.manipulation_score}`;$('json').textContent=JSON.stringify(j,null,2);$('status').textContent='Tamamlandı.'}catch(e){$('status').textContent='API bulunamadı. `uvicorn teyitscope.api:app` ile başlatın.'}};</script></body></html>
